name: Personal dashboard release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/build-dashboard.sh
      - run: go test -tags sqlite_fts5 ./...
      - name: Package native binary, corresponding source and provenance
        run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: personal-dashboard-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
