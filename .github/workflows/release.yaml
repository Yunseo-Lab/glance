name: Personal dashboard release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/build-dashboard.sh
      - run: go test ./...
      - name: Package native binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          platform="$(go env GOOS)-$(go env GOARCH)"
          mkdir -p release-artifacts
          tar -czf "release-artifacts/glance-${platform}.tar.gz" -C build glance
          if command -v sha256sum >/dev/null; then
            (cd release-artifacts && sha256sum *.tar.gz > SHA256SUMS)
          else
            (cd release-artifacts && shasum -a 256 *.tar.gz > SHA256SUMS)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: personal-dashboard-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
