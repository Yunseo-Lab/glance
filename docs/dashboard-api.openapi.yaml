openapi: 3.0.3
info:
  title: Glance editable dashboard
  version: 0.1.0
  description: |
    Single-owner API. When GLANCE_DASHBOARD_TOKEN is configured, private API routes require a session cookie or Basic authentication.
    Mutation endpoints require a same-origin Origin header. Login assets are public.
    Layout and source edits are an atomic, revision-checked aggregate update.
servers:
  - url: /
security:
  - {}
  - basicAuth: []
  - ownerSession: []
paths:
  /api/v1/sources:
    get:
      operationId: getSourceStatuses
      responses:
        '200':
          description: Owner sources with board references, safe snapshot metadata, pause and job states; excludes snapshot body
  /api/v1/diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        '200':
          description: Source/job counts and capacity limits without private payloads or credentials
  /api/v1/sources/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: requestSourceRefresh
      responses:
        '202':
          description: Accepted within owner and source quota; includes nextAllowedAt
        '429':
          description: Cooldown; Retry-After header explains when to retry. Does not bypass provider backoff.
  /api/v1/sources/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: pauseSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: Source pause/resume applied, old refresh generation invalidated
  /api/v1/limits:
    get:
      operationId: getCapacityLimits
      responses:
        '200':
          description: Owner instance capacity policy
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
  /api/v1/boards:
    get:
      operationId: listBoards
      responses:
        '200':
          description: Owner-scoped boards, default board first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
    post:
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                cloneFrom:
                  type: string
      responses:
        '201':
          description: New board with revision 1; at most 10 owner boards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
  /api/v1/boards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBoard
      responses:
        '200':
          description: Owner board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
    put:
      operationId: updateBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
      responses:
        '200':
          description: Atomically saved board; ID must match the route and revision must be current
        '409':
          description: Revision conflict
    delete:
      operationId: deleteBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
      responses:
        '200':
          description: Board deleted; home is protected
        '409':
          description: Revision conflict
  /api/v1/catalog:
    get:
      operationId: getCatalog
      responses:
        '200':
          description: Versioned, build-time widget and provider catalog; never includes credentials
          content:
            application/json:
              schema:
                type: object
                required: [version, widgets, providers]
                properties:
                  version:
                    type: integer
                  widgets:
                    type: array
                    items:
                      type: object
                  providers:
                    type: array
                    items:
                      type: object
  /api/v1/auth/session:
    get:
      security: []
      operationId: getOwnerSession
      responses:
        '200':
          description: Authentication enabled/authenticated booleans; no private dashboard data
  /api/v1/auth/login:
    post:
      security: []
      operationId: loginOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Signed, HttpOnly, SameSite=Strict session set; 12 hour expiry
        '401':
          description: Invalid password
        '429':
          description: Login attempt limit exceeded; retry in 60 seconds
  /api/v1/auth/logout:
    post:
      operationId: logoutOwner
      responses:
        '200':
          description: Current session revoked and cookie cleared
  /api/readyz:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database reachable and embedded UI available
        '503':
          description: Database or embedded UI unavailable
  /api/healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Database reachable
        '503':
          description: Database unavailable
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Current committed dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
    put:
      operationId: saveDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
      responses:
        '200':
          description: Committed dashboard with incremented revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Missing or cross-site Origin
        '409':
          description: Revision conflict; preserve local draft and fetch latest
  /api/v1/dashboard/validate:
    post:
      operationId: validateDashboard
      description: Validate an import preview without saving, fetching data, or advancing revision. Requires a same-origin Origin header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
      responses:
        '200':
          description: Validated dashboard, not persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Missing or cross-site Origin
  /api/v1/snapshots:
    get:
      operationId: getSnapshots
      responses:
        '200':
          description: |
            Immediate map from source ID to cached snapshot. Reading expired
            sources schedules bounded asynchronous refresh; it never waits for
            provider requests. Loading/error states may have no data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Snapshot'
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: glance_session
    basicAuth:
      type: http
      scheme: basic
  responses:
    ValidationError:
      description: Invalid dashboard, widget or source
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        code:
          type: string
          description: Stable HTTP error class such as unauthorized or conflict
        error:
          type: string
    Board:
      type: object
      additionalProperties: false
      required: [id, title, revision, theme, widgets, sources]
      properties:
        id:
          type: string
          description: Stable board identifier; home is the backward-compatible default.
        title:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        theme:
          type: string
          enum: [light, dark]
        widgets:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Widget'
        sources:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Source'
    Widget:
      type: object
      additionalProperties: false
      required: [id, type, title, size, config]
      properties:
        configVersion:
          type: integer
          minimum: 1
          maximum: 1
          description: Omitted in original v1 documents; omission means version 1. Unknown versions are rejected.
        id:
          type: string
        type:
          type: string
          enum: [clock, calendar, note, bookmarks, rss, weather]
        title:
          type: string
        size:
          type: string
          enum: [small, wide]
        sourceId:
          type: string
          description: Required for RSS/weather; must reference a source of the same type
        config:
          $ref: '#/components/schemas/WidgetConfig'
    Source:
      type: object
      additionalProperties: false
      required: [id, type, config]
      properties:
        configVersion:
          type: integer
          minimum: 1
          maximum: 1
          description: Omitted in original v1 documents; omission means version 1. Unknown versions are rejected.
        id:
          type: string
        type:
          type: string
          enum: [rss, weather]
        config:
          $ref: '#/components/schemas/SourceConfig'
    Link:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
    WidgetConfig:
      type: object
      additionalProperties: false
      description: Per-type fields are strictly validated using the server catalog.
      properties:
        timezone:
          type: string
        body:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        limit:
          type: integer
    SourceConfig:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        location:
          type: string
    Snapshot:
      type: object
      required: [state]
      properties:
        errorCode:
          type: string
          description: Safe provider error class; contains no remote body, URL or credential
        attemptedAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [loading, fresh, stale, error, paused]
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        retryAt:
          type: string
          format: date-time
        error:
          type: string
        data:
          oneOf:
            - $ref: '#/components/schemas/FeedData'
            - $ref: '#/components/schemas/WeatherData'
    FeedData:
      type: object
      required: [title, items]
      properties:
        title:
          type: string
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [title, url]
            properties:
              title:
                type: string
              url:
                type: string
                format: uri
              publishedAt:
                type: string
                format: date-time
    WeatherData:
      type: object
      required: [location, temperature, feelsLike, humidity, code]
      properties:
        location:
          type: string
        temperature:
          type: number
        feelsLike:
          type: number
        humidity:
          type: integer
        code:
          type: integer
