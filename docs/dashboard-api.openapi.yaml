          type: array
          items:
            type: string
        paused:
          type: boolean
        generation:
          type: integer
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        running:
          type: boolean
        nextRunAt:
          type: string
          format: date-time
        nextManualAt:
          type: string
          format: date-time

    Template:
      type: object
