openapi: 3.0.3
info:
  title: Glance editable dashboard
  version: 0.1.0
  description: |
    Single-owner API. When GLANCE_DASHBOARD_TOKEN is configured, private API routes require a session cookie or Basic authentication.
    Mutation endpoints require a same-origin Origin header. Login assets are public.
    Layout and source edits are an atomic, revision-checked aggregate update.
servers:
  - url: /
security:
  - {}
  - basicAuth: []
  - ownerSession: []
paths:
  /api/v1/brief:
    get:
      operationId: getDailyBrief
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: timezone
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Deterministic owner-local daily brief with source citations; calls no external model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBrief'
        '400':
          description: Invalid civil date or timezone
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: SQLite FTS5 and trigram availability checked before database migration
          content:
            application/json:
              schema:
                type: object
                required: [sqliteVersion, fts5, searchTokenizer]
                properties:
                  sqliteVersion:
                    type: string
                  fts5:
                    type: boolean
                  searchTokenizer:
                    type: string
  /api/v1/tags:
    get:
      operationId: listEntryTags
      responses:
        '200':
          description: Up to 100 owner tags, sorted by entry count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryTag'
  /api/v1/entries/bulk/state:
    post:
      operationId: bulkEntryState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryBulkInput'
      responses:
        '200':
          description: All requested owner entries updated atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryBulkResult'
        '400':
          description: Empty, oversized or invalid update
        '404':
          description: One or more entries not found; no changes committed
  /api/v1/entries:
    get:
      operationId: listEntries
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum: [all, unread, read, saved]
        - name: board
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Owner-scoped keyset page of durable normalized entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
        '400':
          description: Invalid filter, cursor or limit
  /api/v1/entries/{id}/state:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateEntryState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryStateInput'
      responses:
        '200':
          description: Explicit field updates preserve independent read and saved state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryState'
        '400':
          description: Empty or invalid state update
        '404':
          description: Owner entry not found
  /api/v1/imports/opml/preview:
    post:
      operationId: previewOPML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              additionalProperties: false
              properties:
                document:
                  type: string
                  maxLength: 524288
      responses:
        '200':
          description: Validated, deduplicated feeds; performs no writes or upstream requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedImportPreview'
        '400':
          description: Invalid OPML, URL or capacity
  /api/v1/locations:
    get:
      operationId: searchLocations
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: Up to five Open-Meteo locations, ten searches per minute per owner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResult'
        '400':
          description: Invalid search query
        '429':
          description: Search quota reached; Retry-After indicates wait
        '502':
          description: Upstream search unavailable
  /api/v1/templates:
    get:
      operationId: listTemplates
      responses:
        '200':
          description: Key-free starter templates with explicit network requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
  /api/v1/templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: previewTemplate
      responses:
        '200':
          description: New widget/source identities for a preview board; does not persist or fetch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
  /api/v1/connections:
    get:
      operationId: listConnections
      responses:
        '200':
          description: Safe owner connection metadata; never includes ciphertext, tokens or private calendar URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
    post:
      operationId: createConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionInput'
      responses:
        '201':
          description: Encrypted connection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '503':
          description: Original encryption key unavailable; never replaced for existing ciphertext
  /api/v1/connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getConnection
      responses:
        '200':
          description: Safe connection metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
    delete:
      operationId: deleteConnection
      responses:
        '200':
          description: Unreferenced owner connection removed
        '409':
          description: Remove referring sources first
  /api/v1/connections/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: testConnection
      responses:
        '200':
          description: Endpoint-tested capability, not a claim of access to every private resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestReport'
        '429':
          description: Connection test cooldown; Retry-After header
  /api/v1/connections/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeConnection
      responses:
        '200':
          description: Secret cleared, referring sources paused and old generations invalidated
  /api/v1/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteSource
      responses:
        '200':
          description: Unreferenced source removed; saved reading state preserved
        '409':
          description: Remove board references first
  /api/v1/boards/{id}/validate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: validateBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
      responses:
        '200':
          description: Preview-only validation; no persistence or fetch
  /api/v1/boards/{id}/snapshots:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBoardSnapshots
      responses:
        '200':
          description: Snapshot map for the owner board
  /api/v1/sources:
    get:
      operationId: getSourceStatuses
      responses:
        '200':
          description: Owner sources with board references, safe snapshot metadata, pause and job states; excludes snapshot body
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceStatus'
  /api/v1/diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        '200':
          description: Source/job counts and capacity limits without private payloads or credentials
  /api/v1/sources/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: requestSourceRefresh
      responses:
        '202':
          description: Accepted within owner and source quota; includes nextAllowedAt
        '429':
          description: Cooldown; Retry-After header explains when to retry. Does not bypass provider backoff.
  /api/v1/sources/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: pauseSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: Source pause/resume applied, old refresh generation invalidated
  /api/v1/limits:
    get:
      operationId: getCapacityLimits
      responses:
        '200':
          description: Owner instance capacity policy
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
  /api/v1/boards:
    get:
      operationId: listBoards
      responses:
        '200':
          description: Owner-scoped boards, default board first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
    post:
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                cloneFrom:
                  type: string
                template:
                  type: string
                  description: Starter template ID; mutually exclusive with cloneFrom
      responses:
        '201':
          description: New board with revision 1; at most 10 owner boards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
  /api/v1/boards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBoard
      responses:
        '200':
          description: Owner board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
    put:
      operationId: updateBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
      responses:
        '200':
          description: Atomically saved board; ID must match the route and revision must be current
        '409':
          description: Revision conflict
    delete:
      operationId: deleteBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
      responses:
        '200':
          description: Board deleted; home is protected
        '409':
          description: Revision conflict
  /api/v1/catalog:
    get:
      operationId: getCatalog
      responses:
        '200':
          description: Versioned, build-time widget and provider catalog; never includes credentials
          content:
            application/json:
              schema:
                type: object
                required: [version, widgets, providers]
                properties:
                  version:
                    type: integer
                  widgets:
                    type: array
                    items:
                      type: object
                  providers:
                    type: array
                    items:
                      type: object
  /api/v1/auth/session:
    get:
      security: []
      operationId: getOwnerSession
      responses:
        '200':
          description: Authentication enabled/authenticated booleans; no private dashboard data
  /api/v1/auth/login:
    post:
      security: []
      operationId: loginOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Signed, HttpOnly, SameSite=Strict session set; 12 hour expiry
        '401':
          description: Invalid password
        '429':
          description: Login attempt limit exceeded; retry in 60 seconds
  /api/v1/auth/logout:
    post:
      operationId: logoutOwner
      responses:
        '200':
          description: Current session revoked and cookie cleared
  /api/readyz:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database reachable and embedded UI available
        '503':
          description: Database or embedded UI unavailable
  /api/healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Database reachable
        '503':
          description: Database unavailable
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Current committed dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
    put:
      operationId: saveDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
      responses:
        '200':
          description: Committed dashboard with incremented revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Missing or cross-site Origin
        '409':
          description: Revision conflict; preserve local draft and fetch latest
  /api/v1/dashboard/validate:
    post:
      operationId: validateDashboard
      description: Validate an import preview without saving, fetching data, or advancing revision. Requires a same-origin Origin header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
      responses:
        '200':
          description: Validated dashboard, not persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Missing or cross-site Origin
  /api/v1/snapshots:
    get:
      operationId: getSnapshots
      responses:
        '200':
          description: |
            Immediate map from source ID to cached snapshot. Reading expired
            sources schedules bounded asynchronous refresh; it never waits for
            provider requests. Loading/error states may have no data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Snapshot'
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: glance_session
    basicAuth:
      type: http
      scheme: basic
  responses:
    ValidationError:
      description: Invalid dashboard, widget or source
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        code:
          type: string
          description: Stable HTTP error class such as unauthorized or conflict
        error:
          type: string
    Board:
      type: object
      additionalProperties: false
      required: [id, title, revision, theme, widgets, sources]
      properties:
        id:
          type: string
          description: Stable board identifier; home is the backward-compatible default.
        title:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        theme:
          type: string
          enum: [light, dark]
        widgets:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Widget'
        sources:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Source'
    Widget:
      type: object
      additionalProperties: false
      required: [id, type, title, size, config]
      properties:
        configVersion:
          type: integer
          minimum: 1
          maximum: 1
          description: Omitted in original v1 documents; omission means version 1. Unknown versions are rejected.
        id:
          type: string
        type:
          type: string
          enum: [clock, calendar, note, bookmarks, rss, weather, github, agenda, json]
        title:
          type: string
        size:
          type: string
          enum: [small, wide]
        sourceId:
          type: string
          description: Required for RSS/weather; must reference a source of the same type
        config:
          $ref: '#/components/schemas/WidgetConfig'
    Source:
      type: object
      additionalProperties: false
      required: [id, type, config]
      properties:
        connectionId:
          type: string
          description: Reference to server encrypted connection; never a token
        configVersion:
          type: integer
          minimum: 1
          maximum: 1
          description: Omitted in original v1 documents; omission means version 1. Unknown versions are rejected.
        id:
          type: string
        type:
          type: string
          enum: [rss, weather, github, ical, json]
        config:
          $ref: '#/components/schemas/SourceConfig'
    Link:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
    WidgetConfig:
      type: object
      additionalProperties: false
      description: Per-type fields are strictly validated using the server catalog.
      properties:
        unit:
          type: string
        timezone:
          type: string
        body:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        limit:
          type: integer
    SourceConfig:
      type: object
      additionalProperties: false
      properties:
        pointer:
          type: string
        repository:
          type: string
        view:
          type: string
          enum: [repository, releases, issues, pulls]
        units:
          type: string
          enum: [celsius, fahrenheit]
        timezone:
          type: string
        url:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        location:
          type: string
    Snapshot:
      type: object
      required: [state]
      properties:
        manualRefreshAfter:
          type: string
          format: date-time
        errorCode:
          type: string
          description: Safe provider error class; contains no remote body, URL or credential
        attemptedAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [loading, fresh, stale, error, paused]
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        retryAt:
          type: string
          format: date-time
        error:
          type: string
        data:
          oneOf:
            - $ref: '#/components/schemas/FeedData'
            - $ref: '#/components/schemas/WeatherData'
            - $ref: '#/components/schemas/CalendarData'
            - $ref: '#/components/schemas/JSONValueData'
    FeedData:
      type: object
      required: [title, items]
      properties:
        title:
          type: string
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [title, url]
            properties:
              id:
                type: string
                description: Stable source-scoped entry identity; absent in legacy cached snapshots
              excerpt:
                type: string
                description: Plain text only
              title:
                type: string
              url:
                type: string
                format: uri
              publishedAt:
                type: string
                format: date-time

    LocationResult:
      type: object
      additionalProperties: false
      required: [name, country, region, latitude, longitude, timezone]
      properties:
        name:
          type: string
        country:
          type: string
        region:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string

    DailyBrief:
      type: object
      required: [date, timezone, total, unread, saved, items, truncated, fingerprint]
      properties:
        date:
          type: string
          format: date
        timezone:
          type: string
        total:
          type: integer
        unread:
          type: integer
        saved:
          type: integer
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Entry'
        truncated:
          type: boolean
        asOf:
          type: string
          format: date-time
        fingerprint:
          type: string
    EntryTag:
      type: object
      required: [tag, count]
      properties:
        tag:
          type: string
        count:
          type: integer
    EntryBulkResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
    EntryBulkInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        read:
          type: boolean
        saved:
          type: boolean
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
    Entry:
      type: object
      required: [id, title, url, excerpt, collectedAt, sourceTitle, sourceIds, isRead, isSaved, tags]
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
        excerpt:
          type: string
        publishedAt:
          type: string
          format: date-time
        collectedAt:
          type: string
          format: date-time
        sourceTitle:
          type: string
        sourceIds:
          type: array
          items:
            type: string
        isRead:
          type: boolean
        isSaved:
          type: boolean
        tags:
          type: array
          items:
            type: string
    EntryPage:
      type: object
      required: [items, total, capacityReached]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Entry'
        nextCursor:
          type: string
        total:
          type: integer
        capacityReached:
          type: boolean
    EntryState:
      type: object
      required: [isRead, isSaved, tags, updatedAt]
      properties:
        isRead:
          type: boolean
        isSaved:
          type: boolean
        tags:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    EntryStateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        read:
          type: boolean
        saved:
          type: boolean
    FeedImportItem:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
        folder:
          type: string
    FeedImportPreview:
      type: object
      required: [feeds, duplicateCount]
      properties:
        duplicateCount:
          type: integer
        feeds:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/FeedImportItem'
    JSONValueData:
      type: object
      required: [value, kind]
      properties:
        value:
          type: string
          maxLength: 4096
        kind:
          type: string
          enum: [string, number, boolean, 'null']
    CalendarData:
      type: object
      required: [title, events, warnings]
      properties:
        title:
          type: string
        warnings:
          type: array
          items:
            type: string
        events:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CalendarEvent'
    CalendarEvent:
      type: object
      required: [id, title, start, end, allDay, timezone]
      properties:
        id:
          type: string
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        allDay:
          type: boolean
        timezone:
          type: string
        location:
          type: string
        url:
          type: string
    WeatherData:
      type: object
      required: [location, temperature, feelsLike, humidity, code]
      properties:
        unit:
          type: string
          enum: [celsius, fahrenheit]
        timezone:
          type: string
        observedAt:
          type: string
          format: date-time
        location:
          type: string
        temperature:
          type: number
        feelsLike:
          type: number
          nullable: true
        humidity:
          type: integer
          nullable: true
        code:
          type: integer
          nullable: true

    Connection:
      type: object
      additionalProperties: false
      required: [id, kind, name, endpoint, hasSecret, generation, status, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [github, calendar, json]
        name:
          type: string
        endpoint:
          type: string
          description: Public origin only; private paths and query tokens are encrypted
        hasSecret:
          type: boolean
        generation:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        lastTestedAt:
          type: string
          format: date-time
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          type: string
          enum: [github, calendar, json]
        endpoint:
          type: string
          description: Required for calendar/json; stored encrypted. GitHub uses api.github.com.
        token:
          type: string
          format: password
          maxLength: 4096
    ConnectionTestReport:
      type: object
      required: [connected, capabilities]
      properties:
        connected:
          type: boolean
        identity:
          type: string
        capabilities:
          type: array
          items:
            type: string
        errorCode:
          type: string
    SourceStatus:
      type: object
      required: [source, boardIds, paused, generation, snapshot, running]
      properties:
        source:
          $ref: '#/components/schemas/Source'
