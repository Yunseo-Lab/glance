services:
  dashboard:
    environment:
      GLANCE_DASHBOARD_PUBLIC_URL: ${GLANCE_PUBLIC_URL:?Set an HTTPS origin in .env}
  caddy:
    image: ${GLANCE_PROXY_IMAGE:-glance-proxy:local}
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "${GLANCE_BIND_IP:-0.0.0.0}:${GLANCE_HTTP_PORT:-80}:80"
      - "${GLANCE_BIND_IP:-0.0.0.0}:${GLANCE_HTTPS_PORT:-443}:443"
    environment:
      GLANCE_DOMAIN: ${GLANCE_DOMAIN:?Set a domain in .env}
      NO_PROXY: dashboard,localhost,127.0.0.1,::1
      no_proxy: dashboard,localhost,127.0.0.1,::1
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -Y, 'off', -q, --spider, 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
